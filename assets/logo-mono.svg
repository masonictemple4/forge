<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Monochrome version - uses currentColor for CSS adaptability -->
  <!-- Default: dark theme friendly (light strokes) -->
  
  <!-- THE COMPASS - pointing upward -->
  <polygon 
    points="200,40 170,260 185,265 200,75 215,265 230,260" 
    fill="currentColor"
    opacity="0.9"
  />
  
  <!-- Compass legs spread outward -->
  <polygon points="200,75 100,280 115,290 200,110" fill="currentColor" opacity="0.9"/>
  <polygon points="200,75 300,280 285,290 200,110" fill="currentColor" opacity="0.9"/>
  
  <!-- THE SQUARE -->
  <g fill="currentColor" opacity="0.7">
    <rect x="90" y="220" width="220" height="20" rx="2"/>
    <rect x="90" y="220" width="20" height="100" rx="2"/>
    <rect x="290" y="220" width="20" height="100" rx="2"/>
  </g>
  
  <!-- Central blazing star -->
  <g transform="translate(200, 175)">
    <!-- Triangle -->
    <polygon 
      points="0,-35 30,20 -30,20" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="3"
      opacity="0.8"
    />
    
    <!-- The eye -->
    <circle cx="0" cy="0" r="12" fill="currentColor" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="currentColor" opacity="0.3"/>
    
    <!-- Radiating lines -->
    <g stroke="currentColor" stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="-45" x2="0" y2="-55"/>
      <line x1="32" y1="-23" x2="39" y2="-28"/>
      <line x1="32" y1="23" x2="39" y2="28"/>
      <line x1="0" y1="30" x2="0" y2="38"/>
      <line x1="-32" y1="23" x2="-39" y2="28"/>
      <line x1="-32" y1="-23" x2="-39" y2="-28"/>
    </g>
  </g>
  
  <!-- Speed lines -->
  <g stroke="currentColor" stroke-width="2" opacity="0.4">
    <line x1="60" y1="150" x2="80" y2="150"/>
    <line x1="50" y1="175" x2="75" y2="175"/>
    <line x1="60" y1="200" x2="80" y2="200"/>
    <line x1="340" y1="150" x2="320" y2="150"/>
    <line x1="350" y1="175" x2="325" y2="175"/>
    <line x1="340" y1="200" x2="320" y2="200"/>
  </g>
  
  <!-- Precision marks -->
  <g fill="currentColor" opacity="0.5">
    <circle cx="200" cy="40" r="4"/>
    <circle cx="100" cy="280" r="3"/>
    <circle cx="300" cy="280" r="3"/>
  </g>
  
  <!-- FORGE text -->
  <text 
    x="200" 
    y="400" 
    text-anchor="middle" 
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
    font-size="64" 
    font-weight="600" 
    letter-spacing="12"
    fill="currentColor"
  >FORGE</text>
  
  <!-- Underline -->
  <rect x="100" y="415" width="200" height="3" rx="1.5" fill="currentColor" opacity="0.6"/>
  
  <!-- Tagline -->
  <text 
    x="200" 
    y="450" 
    text-anchor="middle" 
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
    font-size="14" 
    font-weight="300" 
    letter-spacing="4"
    fill="currentColor"
    opacity="0.5"
  >BUILD • SHIP • EXCEL</text>
</svg>

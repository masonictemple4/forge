<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Forge Logo v2 - Minimalist Geometric -->
  <!-- Abstract anvil/F shape with forward-leaning angular geometry -->
  
  <defs>
    <!-- Subtle gradient for depth while maintaining minimal aesthetic -->
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  
  <!-- Main hexagonal frame - architectural precision -->
  <polygon 
    points="50,8 88,27 88,73 50,92 12,73 12,27" 
    fill="none" 
    stroke="#1a1a1a" 
    stroke-width="3"
    stroke-linejoin="miter"/>
  
  <!-- Abstract F / Anvil form - forward-leaning geometry -->
  <!-- Top horizontal bar (anvil top / F top) -->
  <polygon 
    points="28,26 72,26 68,34 28,34" 
    fill="url(#forgeGrad)"/>
  
  <!-- Middle horizontal bar (F middle) - shorter, creating the F -->
  <polygon 
    points="28,44 58,44 55,52 28,52" 
    fill="url(#forgeGrad)"/>
  
  <!-- Vertical stem (F stem / anvil body) - angled for speed -->
  <polygon 
    points="28,26 36,26 40,74 28,74" 
    fill="url(#forgeGrad)"/>
  
  <!-- Accent strike mark - forge spark / forward motion -->
  <polygon 
    points="62,56 78,48 76,52 62,60" 
    fill="#e63946"/>
  
</svg>

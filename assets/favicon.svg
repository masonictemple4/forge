<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F4D03F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0D1F33"/>
    </linearGradient>
  </defs>
  
  <!-- Simplified compass pointing up -->
  <polygon 
    points="32,6 18,48 24,50 32,16 40,50 46,48" 
    fill="url(#blue)"
  />
  
  <!-- Compass spread legs -->
  <polygon points="32,16 12,52 18,56 32,26" fill="url(#blue)"/>
  <polygon points="32,16 52,52 46,56 32,26" fill="url(#blue)"/>
  
  <!-- Square base - simplified L shape -->
  <rect x="10" y="38" width="44" height="5" rx="1" fill="url(#gold)"/>
  <rect x="10" y="38" width="5" height="20" rx="1" fill="url(#gold)"/>
  <rect x="49" y="38" width="5" height="20" rx="1" fill="url(#gold)"/>
  
  <!-- Central eye/blazing star -->
  <circle cx="32" cy="32" r="8" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="4" fill="url(#blue)"/>
  
  <!-- Tiny radiating points -->
  <g fill="url(#gold)" opacity="0.8">
    <circle cx="32" cy="20" r="1.5"/>
    <circle cx="42" cy="28" r="1.5"/>
    <circle cx="22" cy="28" r="1.5"/>
  </g>
</svg>

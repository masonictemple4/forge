<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Forge Logo v2 Refined - Minimalist Geometric with Subtle Masonic Symbolism -->
  <!-- Hidden elements: pyramid triangle, compass arc, column fluting, square angles, G suggestion -->
  
  <defs>
    <!-- Subtle gradient for depth -->
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    
    <!-- Very subtle fluting gradient for column effect -->
    <linearGradient id="flutingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="38.2%" stop-color="#222"/>
      <stop offset="61.8%" stop-color="#222"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Main hexagonal frame - architectural precision -->
  <polygon 
    points="50,8 88,27 88,73 50,92 12,73 12,27" 
    fill="none" 
    stroke="#1a1a1a" 
    stroke-width="3"
    stroke-linejoin="miter"/>
  
  <!-- Subtle pyramid/triangle in negative space - eye of providence reference -->
  <!-- Positioned at golden ratio from top (8 + 84*0.382 ≈ 40) -->
  <polygon 
    points="50,18 58,32 42,32" 
    fill="none" 
    stroke="#1a1a1a" 
    stroke-width="0.75"
    stroke-opacity="0.3"/>
  
  <!-- Abstract F / Anvil form - forward-leaning geometry -->
  
  <!-- Top horizontal bar (anvil top / F top) -->
  <polygon 
    points="28,26 72,26 68,34 28,34" 
    fill="url(#forgeGrad)"/>
  
  <!-- Middle horizontal bar (F middle) - shorter, creating the F -->
  <polygon 
    points="28,44 58,44 55,52 28,52" 
    fill="url(#forgeGrad)"/>
  
  <!-- Vertical stem with subtle column fluting effect (Doric column reference) -->
  <polygon 
    points="28,26 36,26 40,74 28,74" 
    fill="url(#flutingGrad)"/>
  
  <!-- Subtle fluting lines on stem - architectural column detail -->
  <line x1="31" y1="28" x2="32" y2="72" stroke="#0d0d0d" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="34" y1="27" x2="37" y2="73" stroke="#0d0d0d" stroke-width="0.5" stroke-opacity="0.4"/>
  
  <!-- Small right-angle mark - Masonic square reference (architectural detail) -->
  <path 
    d="M 28,74 L 28,70 L 32,70" 
    fill="none" 
    stroke="#1a1a1a" 
    stroke-width="0.75"
    stroke-opacity="0.5"/>
  
  <!-- Accent spark - now suggesting compass arc with curved motion -->
  <path 
    d="M 62,56 Q 70,52 78,48 L 76,52 Q 69,55 62,60 Z" 
    fill="#e63946"/>
  
  <!-- Subtle compass arc suggestion - radiating from spark -->
  <path 
    d="M 65,62 A 18,18 0 0,1 80,54" 
    fill="none" 
    stroke="#e63946" 
    stroke-width="0.75"
    stroke-opacity="0.35"/>
  
  <!-- Hidden G - suggested by the curve in negative space between middle bar and stem -->
  <!-- The gap between elements at 52-56 forms a subtle G-like shape -->
  <circle 
    cx="48" 
    cy="62" 
    r="6" 
    fill="none" 
    stroke="#1a1a1a" 
    stroke-width="0.5"
    stroke-opacity="0.2"
    stroke-dasharray="16,6"/>
  
</svg>
